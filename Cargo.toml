[package]
name = "pyrsb3"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings do crate rsb3: arquivos públicos da B3 (COTAHIST) em Arrow"
license = "MIT"
repository = "https://github.com/milkway/pyrsb3"
publish = false

[lib]
name = "_rsb3"
crate-type = ["cdylib"]

[dependencies]
# O core. Fixo com `=`: cada versão do binding declara exatamente qual parser
# produziu seus números (CRATE_VERSION em src/lib.rs tem de acompanhar).
rsb3 = "=0.2.0"
# Mesma versão major do arrow que o rsb3 usa; `pyarrow` traz a ponte C Data
# Interface (RecordBatch Rust <-> pyarrow sem cópia).
arrow = { version = "60", default-features = false, features = ["pyarrow"] }
pyo3 = { version = "0.29", features = ["abi3-py310", "chrono"] }
chrono = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
