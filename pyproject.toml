[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyrsb3"
description = "B3 (Brazilian stock exchange) public files as Arrow: strict COTAHIST parser with integer-cent prices, in Rust."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "André Leite", email = "leite@castlab.org" }]
maintainers = [{ name = "André Leite", email = "leite@castlab.org" }]
keywords = ["b3", "bovespa", "cotahist", "finance", "arrow", "parquet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/milkway/pyrsb3"
Issues = "https://github.com/milkway/pyrsb3/issues"
"Rust crate" = "https://crates.io/crates/rsb3"

[tool.maturin]
python-source = "python"
module-name = "rsb3._rsb3"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: baixa arquivo oficial da B3 (pulado por padrão; rode com -m network)"]
addopts = "-m 'not network'"
